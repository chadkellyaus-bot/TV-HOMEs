plugins { id 'com.android.application' }

// One fixed signing key, kept in this repo as text, so every new build installs over the previous one.
// (Without it, each GitHub build is signed with a new throwaway key and updates refuse to install.)
// It's a public key for a personal project; the TV still asks before any new computer can install apps.
def signingKey = new File(layout.buildDirectory.get().asFile, 'tvhome.keystore')
signingKey.parentFile.mkdirs()
signingKey.bytes = file('tvhome.keystore.b64').text.replaceAll('\\s', '').decodeBase64()

android {
    namespace 'org.tvhome.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'org.tvhome.launcher'
        minSdk 24
        targetSdk 30
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        debug {
            storeFile signingKey
            storePassword 'android'
            keyAlias 'tvhome'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
